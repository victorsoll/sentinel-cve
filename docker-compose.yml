services:
  app:
    build: .
    container_name: sentinel-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./output:/app/output
    expose:
      - "5001"

  web:
    image: nginx:1.27-alpine
    container_name: sentinel-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
